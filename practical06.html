
<!DOCTYPE html>
<html>
<head>
    <title>Student Grade Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-800 px-4 py-10 text-slate-800">

    <main class="mx-auto max-w-lg rounded-xl bg-white p-6 text-center shadow-lg">
        <h2 class="mb-6 text-2xl font-bold text-slate-900">Student Grade Calculator</h2>

        <div class="space-y-4 text-left">
            <div>
                <label for="mark1" class="mb-1 block text-sm font-medium">Enter Marks in Subject 1:</label>
                <input type="number" id="mark1" class="w-full rounded-md border border-slate-300 px-3 py-2 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200">
            </div>

            <div>
                <label for="mark2" class="mb-1 block text-sm font-medium">Enter Marks in Subject 2:</label>
                <input type="number" id="mark2" class="w-full rounded-md border border-slate-300 px-3 py-2 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200">
            </div>

            <div>
                <label for="mark3" class="mb-1 block text-sm font-medium">Enter Marks in Subject 3:</label>
                <input type="number" id="mark3" class="w-full rounded-md border border-slate-300 px-3 py-2 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200">
            </div>

            <div>
                <label for="mark4" class="mb-1 block text-sm font-medium">Enter Marks in Subject 4:</label>
                <input type="number" id="mark4" class="w-full rounded-md border border-slate-300 px-3 py-2 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200">
            </div>

            <div>
                <label for="mark5" class="mb-1 block text-sm font-medium">Enter Marks in Subject 5:</label>
                <input type="number" id="mark5" class="w-full rounded-md border border-slate-300 px-3 py-2 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200">
            </div>

            <button onclick="calculateResult()" class="mt-2 w-full rounded-md bg-blue-600 px-4 py-2 font-semibold text-white transition hover:bg-blue-700">Calculate Result</button>
        </div>

        <div id="result" class="mt-6 rounded-md bg-slate-50 p-4 text-left"></div>
    </main>

    <script>
        function calculateResult() {

            // Get marks
            let mark1 = Number(document.getElementById("mark1").value);
            let mark2 = Number(document.getElementById("mark2").value);
            let mark3 = Number(document.getElementById("mark3").value);
            let mark4 = Number(document.getElementById("mark4").value);
            let mark5 = Number(document.getElementById("mark5").value);

            // Calculate total
            let total = mark1 + mark2 + mark3 + mark4 + mark5;

            // Calculate percentage
            let percentage = (total / 500) * 100;

            // Calculate grade
            let grade;

            if (percentage >= 90) {
                grade = "A+";
            } 
            else if (percentage >= 80) {
                grade = "A";
            } 
            else if (percentage >= 70) {
                grade = "B";
            } 
            else if (percentage >= 60) {
                grade = "C";
            } 
            else if (percentage >= 50) {
                grade = "D";
            } 
            else {
                grade = "F";
            }

            // Display result
            document.getElementById("result").innerHTML =
                "<h3>Result</h3>" +
                "Total Marks: " + total + " / 500<br>" +
                "Percentage: " + percentage + "%<br>" +
                "Grade: " + grade;
        }
    </script>

</body>
</html>
